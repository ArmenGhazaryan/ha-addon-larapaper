configuration:
  app_url:
    name: Server URL
    description: >-
      Address the TRMNL device uses to reach LaraPaper, e.g. http://192.168.1.10:8080.
      LaraPaper also uses it to build the image links it sends to the device, so it
      must be reachable from the device (plain HTTP is the most reliable for e-ink devices).
  app_timezone:
    name: Timezone
    description: Time zone for schedules and timestamps, e.g. America/New_York.
  registration_enabled:
    name: Allow new account sign-ups
    description: >-
      Shows a "Register" option on the login page. Turn on only to create your first
      account, then turn it off again.
  log_level:
    name: Log level
    description: How much detail the add-on writes to its log.
  php_memory_limit:
    name: Memory limit per worker
    description: Maximum memory one PHP worker may use, e.g. 512M (default 512M).
  php_fpm_pm_max_children:
    name: Max render workers
    description: >-
      Maximum PHP workers running at once. Each screen render starts a Chromium
      process, so this caps parallel renders (default 4).
  php_fpm_pm_max_spare_servers:
    name: Idle workers kept ready
    description: Idle PHP workers kept warm for faster responses (default 2).
  trmnl_proxy_base_url:
    name: TRMNL cloud proxy URL
    description: >-
      Only used by devices set to cloud proxy mode, which mixes in screens from your
      trmnl.app account (default https://trmnl.app).
  trmnl_proxy_refresh_minutes:
    name: Cloud proxy refresh (minutes)
    description: How often cloud proxy screens are fetched (default 15).
